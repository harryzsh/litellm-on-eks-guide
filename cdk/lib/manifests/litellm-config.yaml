# ============================================================
# LiteLLM Proxy Config - Bedrock-only routing
# Original source: litellm-best-practice k8s/02-configmap.yaml
#
# Notes:
# - Single AKSK pair (AWS_ACCESS_KEY_ID_1 / AWS_SECRET_ACCESS_KEY_1).
# - aws_region_name uses placeholder __BEDROCK_REGION__ which is
#   substituted by ClusterStack at synth time from CDK context
#   `bedrockRegion` (default: us-east-1).
# ============================================================

model_list:
  # ==== Claude Opus 4.8 ====
  - model_name: claude-opus-4-8
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-8
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID_1
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY_1
      aws_region_name: __BEDROCK_REGION__
    model_info:
      # opus-4-8 isn't in this image's (v1.83.14) bundled cost map, so litellm
      # defaults supports_reasoning=False and drop_params silently strips the
      # (adaptive) thinking param. Force it on so thinking blocks pass through.
      supports_reasoning: true
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
      cache_read_input_token_cost: 0.0000005
      cache_creation_input_token_cost: 0.00000625
      cache_creation_input_token_cost_above_1hr: 0.00001

  # ==== Claude Opus 4.7 ====
  - model_name: claude-opus-4-7
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-7
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID_1
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY_1
      aws_region_name: __BEDROCK_REGION__
    model_info:
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
      cache_read_input_token_cost: 0.0000005
      cache_creation_input_token_cost: 0.00000625
      cache_creation_input_token_cost_above_1hr: 0.00001

  # ==== Claude Opus 4.6 ====
  - model_name: claude-opus-4-6
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-6-v1
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID_1
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY_1
      aws_region_name: __BEDROCK_REGION__
    model_info:
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
      cache_read_input_token_cost: 0.0000005
      cache_creation_input_token_cost: 0.00000625
      cache_creation_input_token_cost_above_1hr: 0.00001

  # ==== Claude Sonnet 4.6 ====
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-6
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID_1
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY_1
      aws_region_name: __BEDROCK_REGION__
    model_info:
      max_input_tokens: 1000000
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_read_input_token_cost: 0.0000003
      cache_creation_input_token_cost: 0.00000375
      cache_creation_input_token_cost_above_1hr: 0.000006

  # ==== Claude Haiku 4.5 ====
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID_1
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY_1
      aws_region_name: __BEDROCK_REGION__
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
      cache_read_input_token_cost: 0.0000001
      cache_creation_input_token_cost: 0.00000125
      cache_creation_input_token_cost_above_1hr: 0.000002

router_settings:
  routing_strategy: simple-shuffle
  redis_host: os.environ/REDIS_HOST
  redis_password: os.environ/REDIS_PASSWORD
  redis_port: os.environ/REDIS_PORT
  num_retries: 3
  timeout: 600
  enable_pre_call_checks: true
  optional_pre_call_checks: ["prompt_caching"]
  allowed_fails: 3
  cooldown_time: 30

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 3
  request_timeout: 600
  json_logs: true

  fallbacks:
    - {"claude-opus-4-8": ["claude-opus-4-7"]}
    - {"claude-opus-4-7": ["claude-opus-4-6"]}
    - {"claude-opus-4-6": ["claude-sonnet-4-6"]}
    - {"claude-sonnet-4-6": ["claude-haiku-4-5-20251001"]}

  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    supported_call_types: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 60
  database_connection_pool_limit: 10
  database_connection_timeout: 60
  disable_error_logs: true
  allow_requests_on_db_unavailable: true
  health_check_details: false
