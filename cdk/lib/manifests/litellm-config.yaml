# ============================================================
# LiteLLM Proxy Config - Bedrock-only routing
# Original source: litellm-best-practice k8s/02-configmap.yaml
#
# Notes:
# - Single AKSK pair (AWS_ACCESS_KEY_ID_1 / AWS_SECRET_ACCESS_KEY_1).
# - aws_region_name uses placeholder __BEDROCK_REGION__ which is
#   substituted by ClusterStack at synth time from CDK context
#   `bedrockRegion` (default: us-east-1).
# ============================================================

model_list:
  # ==== Claude Opus 4.8 ====
  - model_name: claude-opus-4-8
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-8
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID_1
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY_1
      aws_region_name: __BEDROCK_REGION__
      # Strip params Bedrock rejects. enable_thinking and provider are
      # non-standard fields some clients send; litellm forwards unknown extras
      # verbatim -> 400 "Extra inputs not permitted". freq/presence_penalty
      # unsupported by Claude. temperature+top_p
      # together -> 400 on opus-4-7/4-8 (sampling params deprecated), so drop both
      # here; they are KEPT on 4-6/sonnet/haiku where they still work. Per-model
      # because litellm_settings.additional_drop_params is ignored on the bedrock
      # path in this image version.
      drop_params: true
      additional_drop_params: ["enable_thinking", "provider", "frequency_penalty", "presence_penalty", "temperature", "top_p"]
    model_info:
      # opus-4-8 isn't in this image's (v1.83.14) bundled cost map, so litellm
      # defaults supports_reasoning=False and drop_params silently strips the
      # (adaptive) thinking param. Force it on so thinking blocks pass through.
      supports_reasoning: true
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
      cache_read_input_token_cost: 0.0000005
      cache_creation_input_token_cost: 0.00000625
      cache_creation_input_token_cost_above_1hr: 0.00001

  # ==== Claude Opus 4.7 ====
  - model_name: claude-opus-4-7
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-7
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID_1
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY_1
      aws_region_name: __BEDROCK_REGION__
      # See opus-4-8 note. temperature+top_p dropped here too (deprecated on 4.7).
      drop_params: true
      additional_drop_params: ["enable_thinking", "provider", "frequency_penalty", "presence_penalty", "temperature", "top_p"]
    model_info:
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
      cache_read_input_token_cost: 0.0000005
      cache_creation_input_token_cost: 0.00000625
      cache_creation_input_token_cost_above_1hr: 0.00001

  # ==== Claude Opus 4.6 ====
  - model_name: claude-opus-4-6
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-6-v1
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID_1
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY_1
      aws_region_name: __BEDROCK_REGION__
      # Drop only non-Anthropic wild fields. temperature/top_p ARE supported on
      # 4.6 — keep them so clients that legitimately set temperature work.
      drop_params: true
      additional_drop_params: ["enable_thinking", "provider", "frequency_penalty", "presence_penalty"]
    model_info:
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
      cache_read_input_token_cost: 0.0000005
      cache_creation_input_token_cost: 0.00000625
      cache_creation_input_token_cost_above_1hr: 0.00001

  # ==== Claude Sonnet 4.6 ====
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-6
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID_1
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY_1
      aws_region_name: __BEDROCK_REGION__
      drop_params: true
      additional_drop_params: ["enable_thinking", "provider", "frequency_penalty", "presence_penalty"]
    model_info:
      max_input_tokens: 1000000
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_read_input_token_cost: 0.0000003
      cache_creation_input_token_cost: 0.00000375
      cache_creation_input_token_cost_above_1hr: 0.000006

  # ==== Claude Haiku 4.5 ====
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID_1
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY_1
      aws_region_name: __BEDROCK_REGION__
      drop_params: true
      additional_drop_params: ["enable_thinking", "provider", "frequency_penalty", "presence_penalty"]
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
      cache_read_input_token_cost: 0.0000001
      cache_creation_input_token_cost: 0.00000125
      cache_creation_input_token_cost_above_1hr: 0.000002

  # ==== OpenAI GPT-5.5 / 5.4 (Bedrock Mantle, Responses API) ====
  # OpenAI frontier models on Bedrock are served ONLY at the
  # /openai/v1/responses path on the bedrock-mantle endpoint, and ONLY in
  # regions where they are available (us-east-2 at launch). They use a
  # Bedrock API key (bearer token) rather than SigV4 AKSK.
  #
  # litellm's bedrock_mantle provider does NOT register a Responses API config,
  # so these requests get downgraded to chat/completions transformation and
  # fail (functools.partial 'acompletion' error + protocol mismatch). A
  # runtime sitecustomize monkey-patch registers a BedrockMantleResponsesConfig
  # so requests pass through natively. See the bedrock-mantle responses guide
  # and the sitecustomize ConfigMap mounted at /opt/inject.
  - model_name: gpt-5.5
    litellm_params:
      model: bedrock_mantle/openai.gpt-5.5
      api_key: os.environ/BEDROCK_MANTLE_API_KEY
      api_base: "https://bedrock-mantle.us-east-2.api.aws/v1"
    model_info:
      mode: responses
      supports_reasoning: true
      max_input_tokens: 272000
      max_output_tokens: 128000
      input_cost_per_token: 0.0000055    # $5.50 / 1M (AWS Bedrock official)
      output_cost_per_token: 0.000033    # $33.00 / 1M

  - model_name: gpt-5.4
    litellm_params:
      model: bedrock_mantle/openai.gpt-5.4
      api_key: os.environ/BEDROCK_MANTLE_API_KEY
      api_base: "https://bedrock-mantle.us-east-2.api.aws/v1"
    model_info:
      mode: responses
      supports_reasoning: true
      max_input_tokens: 272000
      max_output_tokens: 128000
      input_cost_per_token: 0.00000275   # $2.75 / 1M (AWS Bedrock official)
      output_cost_per_token: 0.0000165   # $16.50 / 1M

router_settings:
  routing_strategy: simple-shuffle
  redis_host: os.environ/REDIS_HOST
  redis_password: os.environ/REDIS_PASSWORD
  redis_port: os.environ/REDIS_PORT
  num_retries: 3
  timeout: 600
  enable_pre_call_checks: true
  optional_pre_call_checks: ["prompt_caching"]
  allowed_fails: 3
  cooldown_time: 30

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 3
  request_timeout: 600
  json_logs: true

  fallbacks:
    - {"claude-opus-4-8": ["claude-opus-4-7"]}
    - {"claude-opus-4-7": ["claude-opus-4-6"]}
    - {"claude-opus-4-6": ["claude-sonnet-4-6"]}
    - {"claude-sonnet-4-6": ["claude-haiku-4-5-20251001"]}

  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    supported_call_types: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 60
  database_connection_pool_limit: 10
  database_connection_timeout: 60
  disable_error_logs: true
  allow_requests_on_db_unavailable: true
  health_check_details: false
